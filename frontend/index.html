<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SatQuery AI</title>
    <meta
      name="description"
      content="Deployment of SatQuery AI for Smart India Hackathon 2026, problem statement SIH26167 (ISRO/SAC). Ask questions about satellite images in English or 22 Indian languages and get answers with the evidence marked on the image."
    />
    <meta name="theme-color" content="#101518" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (WhatsApp, Slack, LinkedIn, X…). Preview images need an
         absolute URL: set VITE_SITE_URL (no trailing slash) at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SatQuery AI" />
    <meta property="og:title" content="SatQuery AI · SIH26167" />
    <meta
      property="og:description"
      content="Deployment for Smart India Hackathon 2026, problem statement SIH26167 (ISRO/SAC): ask satellite images questions in English or 22 Indian languages, with the evidence marked on the image."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="SatQuery AI: ask a satellite image a question. SIH26167, Smart India Hackathon 2026, ISRO/SAC."
    />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SatQuery AI · SIH26167" />
    <meta
      name="twitter:description"
      content="Deployment for Smart India Hackathon 2026, problem statement SIH26167 (ISRO/SAC): ask satellite images questions in English or 22 Indian languages."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="SatQuery AI: ask a satellite image a question. SIH26167, Smart India Hackathon 2026, ISRO/SAC."
    />
    <script>
      // Applies the stored theme before first paint so there is no flash of the
      // wrong colour scheme. The key must match THEME_STORAGE_KEY in
      // src/components/theme-provider.tsx.
      ;(function () {
        try {
          var stored = localStorage.getItem('vite-ui-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.add(theme)
        } catch (e) {
          // No stored preference available; React applies the theme on mount.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
