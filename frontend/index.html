<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      // Applies the stored theme before first paint so there is no flash of the
      // wrong colour scheme. The key must match THEME_STORAGE_KEY in
      // src/components/theme-provider.tsx.
      ;(function () {
        try {
          var stored = localStorage.getItem('vite-ui-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.add(theme)
        } catch (e) {
          // No stored preference available; React applies the theme on mount.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
