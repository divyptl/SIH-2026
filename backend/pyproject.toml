[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openrouter>=1.1.127",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    # Indic <-> English translation layer (services/translation.py).
    "torch>=2.9.0",
    # IndicTransToolkit and the IndicTrans2 remote code do not support transformers 5.
    "transformers>=4.51,<5",
    "sentencepiece>=0.2.0",
    "indictranstoolkit>=1.1.1",
    "typst>=0.15.0",
    # Fine-tuned specialists (grounding, change-VQA, fusion) served by the controller.
    "ml",
]

# torch comes from the workspace root's CUDA index.
[tool.uv.sources]
ml = { workspace = true }
