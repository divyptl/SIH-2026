# Builds the API image for the Raspberry Pi (linux/arm64) and publishes it to
# GitHub Container Registry as ghcr.io/<owner>/satquery-api. The Pi picks up the
# new :latest image by itself (deploy/pi/update.sh, run by cron).
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - ml/**
      - deploy/Dockerfile
      - deploy/start.sh
      - deploy/fetch_weights.py
      - pyproject.toml
      - uv.lock
      - .dockerignore
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  image:
    # Native ARM64 runner (free for public repositories): no emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/satquery-api
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse unchanged layers (the dependency install) between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
